        locator: "ECSPreStartChecker.check/checkAsync"
      - kind: code
        ref: Sources/TunnelPadCore/TunnelManager.swift
        locator: "TunnelManager.start/startAsync/restart/restartAsync"
      - kind: code
        ref: scripts/update-ecs-ssh-ip
