schema_version: 1
project:
  id: tunnelpad
  name: TunnelPad
gitnexus:
  repo: TunnelPad
  indexed_commit: e02fb05

nodes:
  - id: business.tunnelpad
    type: business
    name: TunnelPad 隧道管理
    evidence:
      - kind: document
        ref: docs/plans/tunnelpad-v1.md
        locator: "计划范围与验收目标"

  - id: function.app.lifecycle
    type: function
    name: 应用生命周期与退出清理
    evidence:
      - kind: code
        ref: Sources/tunnelpad/AppDelegate.swift
        locator: "AppDelegate.applicationDidFinishLaunching/applicationShouldTerminate"
      - kind: code
        ref: Sources/TunnelPadCore/Shutdown.swift
        locator: "Shutdown.installSignalHandlers/stopAllManagedTunnels"

  - id: function.config.management
    type: function
    name: 配置加载、保存与刷新
    evidence:
      - kind: code
        ref: Sources/TunnelPadCore/ConfigStore.swift
        locator: "ConfigStore.load/save"
      - kind: code
        ref: Sources/TunnelPadCore/TunnelManager.swift
        locator: "TunnelManager.reloadConfigAsync/updateTunnelAsync"
      - kind: code
        ref: Sources/tunnelpad/MainPanelView.swift
        locator: "MainPanelView 配置刷新按钮"

  - id: function.sidebar.selection
    type: function
    name: 隧道列表、选择与详情面板
