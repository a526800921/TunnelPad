        ref: Sources/TunnelPadCore/TunnelManager.swift
        locator: "TunnelManager.start/stop/restart/removeTunnel"
      - kind: code
        ref: rust/tunnelpad-core/src/owner.rs
        locator: "CoreOwner.start/stop/restart/remove_with_generation"
      - kind: test
        ref: Tests/TunnelPadCoreTests/RefactorBoundaryTests.swift
        locator: "异步生命周期与失败注入测试"

  - id: function.launchd.executor
    type: function
    name: launchd 执行器
    evidence:
      - kind: code
        ref: Sources/TunnelPadCore/LaunchCtlExecutor.swift
        locator: "LaunchCtlExecutor.bootstrap/bootout/status"
      - kind: code
        ref: Sources/TunnelPadCore/LaunchdPlistRenderer.swift
        locator: "LaunchdPlistRenderer.writePlist"
      - kind: test
        ref: Tests/TunnelPadCoreTests/LaunchCtlExecutorTests.swift
        locator: "launchctl 状态解析与 bootout 测试"

  - id: function.health.probe
    type: function
    name: HTTP 探针与健康判定
