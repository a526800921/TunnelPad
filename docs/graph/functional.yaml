        ref: Sources/TunnelPadCore/ProbeService.swift
        locator: "ProbeService.check"
      - kind: code
        ref: Sources/TunnelPadCore/ProbeCoordinator.swift
        locator: "ProbeCoordinator.run/cancel"
      - kind: document
        ref: docs/plans/tunnelpad-stability.md
        locator: "目标与健康恢复状态机"

  - id: function.ecs.ssh.preflight
