schema_version: 1
project:
  id: tunnelpad
  name: TunnelPad
gitnexus:
  repo: TunnelPad
  indexed_commit: e34bce7

nodes:
  - id: business.tunnelpad
    type: business
    name: TunnelPad 隧道管理
    evidence:
      - kind: document
        ref: docs/plans/tunnelpad-v1.md
        locator: "计划范围与验收目标"

  - id: function.app.lifecycle
    type: function
    name: 应用生命周期与退出清理
    evidence:
      - kind: code
        ref: Sources/tunnelpad/AppDelegate.swift
        locator: "AppDelegate.applicationDidFinishLaunching/applicationShouldTerminate"
      - kind: code
        ref: Sources/TunnelPadCore/Shutdown.swift
        locator: "Shutdown.installSignalHandlers/stopAllManagedTunnels"

  - id: function.config.management
    type: function
    name: 配置加载、保存与刷新
    evidence:
      - kind: code
        ref: Sources/TunnelPadCore/ConfigStore.swift
        locator: "ConfigStore.load/save"
      - kind: code
        ref: Sources/TunnelPadCore/TunnelManager.swift
        locator: "TunnelManager.reloadConfigAsync/updateTunnelAsync"
      - kind: code
        ref: Sources/tunnelpad/MainPanelView.swift
        locator: "MainPanelView 配置刷新按钮"

  - id: function.sidebar.selection
    type: function
    name: 隧道列表、选择与详情面板
    evidence:
      - kind: code
        ref: Sources/tunnelpad/MainPanelView.swift
        locator: "MainPanelView.sidebar/selectedTunnel"
      - kind: code
        ref: Sources/tunnelpad/TunnelDetailComponents.swift
        locator: "TunnelSidebarRow/TunnelDetailView"
      - kind: document
        ref: docs/plans/tunnelpad-tunnel-remarks.md
        locator: "目标与左侧列表副标题"

  - id: function.tunnel.lifecycle
    type: function
    name: 隧道启动、停止、重启与删除
    evidence:
      - kind: code
        ref: Sources/TunnelPadCore/TunnelManager.swift
        locator: "TunnelManager.start/stop/restart/removeTunnel"
      - kind: code
        ref: Sources/TunnelPadCore/TunnelLifecycleCoordinator.swift
        locator: "TunnelLifecycleCoordinator.start/stop/restart"
      - kind: test
        ref: Tests/TunnelPadCoreTests/RefactorBoundaryTests.swift
        locator: "异步生命周期与失败注入测试"

  - id: function.launchd.executor
    type: function
    name: launchd 执行器
    evidence:
      - kind: code
        ref: Sources/TunnelPadCore/LaunchCtlExecutor.swift
        locator: "LaunchCtlExecutor.bootstrap/bootout/status"
      - kind: code
        ref: Sources/TunnelPadCore/LaunchdPlistRenderer.swift
        locator: "LaunchdPlistRenderer.writePlist"
      - kind: test
        ref: Tests/TunnelPadCoreTests/LaunchCtlExecutorTests.swift
        locator: "launchctl 状态解析与 bootout 测试"

  - id: function.app.executor
    type: function
    name: app 子进程执行器
    evidence:
      - kind: code
        ref: Sources/TunnelPadCore/AppProcessExecutor.swift
        locator: "AppProcessExecutor.start/stop/handleTermination/shutdownAll"
      - kind: code
        ref: Sources/TunnelPadCore/Shutdown.swift
        locator: "Shutdown.killByPidfile"
      - kind: test
        ref: Tests/TunnelPadCoreTests/AppProcessExecutorTests.swift
        locator: "进程生命周期、keepAlive 与 pidfile 测试"

  - id: function.health.probe
    type: function
    name: HTTP 探针与健康判定
    evidence:
      - kind: code
        ref: Sources/TunnelPadCore/ProbeService.swift
        locator: "ProbeService.check"
      - kind: code
        ref: Sources/TunnelPadCore/ProbeCoordinator.swift
        locator: "ProbeCoordinator.run/cancel"
      - kind: document
        ref: docs/plans/tunnelpad-stability.md
        locator: "目标与健康恢复状态机"

  - id: function.log.management
    type: function
    name: 日志写入、尾部读取与日志面板
    evidence:
      - kind: code
        ref: Sources/TunnelPadCore/AppProcessExecutor.swift
        locator: "AppProcessExecutor stdout/stderr 日志写入"
      - kind: code
        ref: Sources/tunnelpad/LogView.swift
        locator: "LogView.load/LogTextView.updateNSView"
      - kind: document
        ref: docs/plans/tunnelpad-log-streaming.md
        locator: "目标与面板生命周期"

  - id: function.legacy.migration
    type: function
    name: 旧 LaunchAgent 扫描、接管与回滚
    evidence:
      - kind: code
        ref: Sources/TunnelPadCore/MigrationService.swift
        locator: "MigrationService.takeOver/rollback"
      - kind: code
        ref: Sources/TunnelPadCore/TunnelManager.swift
        locator: "TunnelManager.takeOver/legacyAgentsNeedingMigration"
      - kind: test
        ref: Tests/TunnelPadCoreTests/MigrationServiceTests.swift
        locator: "迁移备份、接管、验证与回滚测试"

  - id: function.menu.bar
    type: function
    name: 菜单栏隧道控制
    evidence:
      - kind: code
        ref: Sources/tunnelpad/MenuBarController.swift
        locator: "MenuBarController.rebuildMenu/toggleTunnel/menuWillOpen"
      - kind: document
        ref: docs/data-quality/tunnelpad-ui-refinements-stage4-20260830.md
        locator: "菜单栏单项启停验收"

  - id: function.runtime.coordination
    type: function
    name: 运行时状态、代次与并发取消
    evidence:
      - kind: code
        ref: Sources/TunnelPadCore/TunnelRuntimeState.swift
        locator: "TunnelRuntimeState"
      - kind: code
        ref: Sources/TunnelPadCore/TunnelManager.swift
        locator: "TunnelManager beginOperation/isCurrentOperation/updateRuntime"
      - kind: document
        ref: docs/data-quality/tunnelpad-code-quality-refactor-stage1-20260830.md
        locator: "异步取消保护与代次基线"

  - id: function.rust.parity
    type: function
    name: Swift/Rust Core 行为一致性
    evidence:
      - kind: document
        ref: docs/plans/tunnelpad-rust-migration.md
        locator: "组件 parity、shadow bridge 与阶段准入"
      - kind: test
        ref: Tests/TunnelPadCoreTests/DifferentialHarnessTests.swift
        locator: "Swift/Rust 差分 harness"

  - id: process.app.startup
    type: process
    name: 应用启动与初始刷新
    evidence:
      - kind: code
        ref: Sources/tunnelpad/AppDelegate.swift
        locator: "applicationDidFinishLaunching"
      - kind: code
        ref: Sources/tunnelpad/MainPanelView.swift
        locator: "MainPanelView.task 初始 refreshAsync"

  - id: process.app.terminate
    type: process
    name: 应用退出与全部隧道清理
    evidence:
      - kind: code
        ref: Sources/tunnelpad/AppDelegate.swift
        locator: "applicationShouldTerminate"
      - kind: code
        ref: Sources/TunnelPadCore/Shutdown.swift
        locator: "stopAllAndExit"

  - id: process.config.reload
    type: process
    name: 点击刷新配置并刷新状态
    evidence:
      - kind: code
        ref: Sources/tunnelpad/MainPanelView.swift
        locator: "重新加载 config.json 按钮"
      - kind: code
